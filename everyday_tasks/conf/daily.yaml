# 每日增量更新 · 配置
# ============================================================================
# ★ 本工程独立于 /root/autodl-fs/datadownload 的爬虫框架：不 import 它的代码，
#   只对齐它的**数据格式**。接口配置照抄在 data_incremental/registry.py。
#
# 改动本文件无需重启，每次运行重新读取。
# ============================================================================

version: 1

# 手动启动 main.py 同样执行；在加载数值库之前生效。
# 24 GiB 是进程虚拟地址空间上限，不是预分配，也不是 GPU 显存。
resources:
  max_address_space_gib: 24
  numeric_threads: 2

# ---------------------------------------------------------------- 路径
# 数据与 manifest 的落点固定指向旧工程（同一份 parquet / 同一份 state）。
# 本工程自己的状态在 everyday_tasks/state/ 下，绝不污染共享 state。
paths:
  shared_data: "/autodl-fs/data/datadownload/data"
  shared_state: "/autodl-fs/data/datadownload/state"

# ---------------------------------------------------------------- API
api:
  base_url: "https://data.diemeng.chat/api"
  api_key_file: "/autodl-fs/data/datadownload/APIKey.txt"
  # 官方红线 280 次/分钟；旧工程长跑验证的稳定工作点是 260（实测 275 会触发厂商
  # nginx 的 HTTP 502 软性节流）。两个工程共用同一份全局限速台账，加起来不超这个数。
  rate_limit_per_min: 260
  global_rate_limit: true
  global_rate_limit_file: "/autodl-fs/data/datadownload/state/ratelimit.json"
  # ★ 2026-09-15 按参考实现（/root/scripts）对齐：
  #   原先线程数 6 / 在途 3；现统一为已验收的线程数 3 / 在途 2，降低峰值。
  #   实测加大在途并发会让服务端软性节流（12 并发时单请求 0.8s → 10s，总耗时反而慢 20 倍）。
  #   并发度由 max_inflight 决定，不由 worker 数决定。
  concurrency: 3
  max_inflight: 2
  timeout: 120
  # ★ 重试等待档位（用户 2026-09-15 指定）：1s → 3s → 5s → 10s → 30s，共 **5 次重试**
  #   （+首次 = 6 次尝试）；五档都失败才记 ⚠️ 交报告，下一轮尾部窗口自动重试。
  #   为什么用固定档位而不是指数退避：厂商 nginx 的 502 是**分时段发作**的，
  #   退避总量差不多，但固定档位**好对账** —— 日志里能直接看出"退到第几档"。
  #   配成 [] 则退回指数退避（backoff_base / backoff_max）。
  retry_backoff_seconds: [1, 3, 5, 10, 30]
  max_retries: 6            # 仅当 retry_backoff_seconds 为空时才生效
  backoff_base: 1.6
  backoff_max: 30
  # 服务端硬限制：page * page_size <= 100000
  max_rows_per_query: 100000

# ---------------------------------------------------------------- 增量窗口
download:
  # ★ 用户 2026-09-14 要求：T 时刻增量更新，不仅要取 T，还要取 T-1…T-5。
  #   所有非 range 的尾部窗口都按这个天数回捞。改动它 = 改所有表的冗余度。
  #   ⚠️ 语义是 [T - redundancy_days, T]（含两端）。设 5 → 6 个交易日。
  redundancy_days: 5

  # range/per_date 的**额外历史回刷窗口**（日历天），在尾部窗口之外再往前多看几天。
  # ★ 默认 0：尾部窗口（冗余 5 个交易日 ≈ 7 个日历天）已经覆盖了日常的追溯修正，
  #   再叠一个 10 天的窗口只是把每天的请求量翻倍（旧工程就是这么干的）。
  #   只有**低频表**需要更大值（季频快照 400 天、研报 90 天）——那些在 registry.py
  #   的 `_REVISION` 里逐表覆写。
  revision_days: 0

  # 逐股/逐实体的批量编组大小（具体值在 registry.py 里按接口能力覆写）
  #   注：批量、写缓冲阈值都是**代码里的常数**，这里不再放无效开关
  #   （2026-09-17 清理：`default_batch` / `write_buffer_rows` 从没被读过）

# ---------------------------------------------------------------- 闸门
gate:
  # 用户要求：没到齐就 5 分钟后再查，循环，直到全部到齐才开跑
  interval_seconds: 300
  # ★ 2026-09-15 深夜：4.0 → **6.0**。依据是当天实测的发布时点——
  #   最晚的三张（ths_hot / stock_st_info / index_ths_daily）发布落在 **21:22~23:32**，
  #   从 20:00 起跑 4 小时刚好卡在 00:00，没有余量。延长到 6h（→02:00）更稳。
  max_wait_hours: 6.0
  # 超时后的行为（用户 2026-09-14 拍板）：
  #   partial = 只跑已就绪的表，跳过未就绪的并在报告里显著标注；
  #             被跳过的表不写 coverage/done，下一轮自动补（尾部窗口是幂等的）
  #   strict  = 直接退出，一个表都不跑（旧工程的行为，会让一张永久迟滞的表废掉整个日更）
  on_timeout: partial
  # 发布完整性阈值：探测到的当日行数 >= 近 5 个交易日中位数 × 该比例 才算"已发布"
  # （防"收盘前跑"拿到半量数据，也防半量发布被误判为已发布）
  publish_ratio: 0.7
  # 连续多少天观测到 observed_delay > declared_delay 就自动采用观测值
  autobump_after_days: 3
  # ★★ 2026-09-17 新增：delay **自动上调的上限**（相对声明值最多 +N 天）。
  #   为什么必须有：delay 只上不下、且取数窗口上界 = `T - delay` ——
  #   一旦探针侧出问题（实测：代表实体取到退市股），delay 会每晚 +1，
  #   窗口上界随之后退 → **最新的 N 天永远不被请求**，而报告仍显示 ✔（静默停更）。
  #   封顶后，"一直探测不到"变成一条要人看的告警，而不是继续自伤。
  delay_autobump_max: 2
  # 交叉验证：/ths/hot 不传日期会返回"该市场最新交易日"，用它校验 T
  cross_check: true

# ---------------------------------------------------------------- 日历
calendar:
  # ★ 用户要求：basic_calendar 更新到未来 T+30
  extend_days: 30

# ---------------------------------------------------------------- 单日 MD5 台账
dayhash:
  enabled: true
  # 每次增量后，对尾部窗口内的日期重算指纹并与台账比对；
  # 不一致 → 判定"厂商修改了历史数据"，报告里定位到 数据集/日期/列
  #
  # ★★ 2026-09-17：`sample_old_days` 原来是个**死配置**（全工程没人读它）——
  #   也就是说"防止厂商偷偷改历史"这件事，以前只覆盖尾部窗口那 ~6 个交易日，
  #   更早的历史**完全没有保护**。现在真的接线了：
  #   每轮从**台账里已有的日期**中（尾窗之外）确定性轮换抽查 N 天。
  #   台账里没有的日期不算（算不出"变了没有"）—— 想让抽查覆盖更早的历史，
  #   先跑一次 `main.py init-hashes --only <表>`（已分批，不会 OOM）。
  sample_old_days: 3

# ---------------------------------------------------------------- daily_dump 通道
dump:
  # 修复扫描窗口（日历天）。每天都扫**本地行数**（零请求）找出"不完整的那天"：
  #   · 太窄（只扫尾部窗口 5 个交易日）：某天没在窗口内修好就**永久滑出**，
  #     再也补不回（dump 接口其实能取最近 ~90 天）；
  #   · 太宽：每次多扫点本地数据（网络盘读得慢，45 天约几秒）。
  # 上限 88（接口只覆盖约 90 天）。完整性的判据与"缓存能不能采信"完全一致。
  repair_lookback_days: 45

# ---------------------------------------------------------------- 可视化
viz:
  # 跑完打印 ASCII 汇总表
  summary: true
