{
  "name": "r7a_tax_expense_seasonal_change_v1",
  "family_id": "r7a_tax_expense_v1",
  "implementation": "research.families.r7a_tax_expense_v1:build",
  "parameters": {
    "signal": "tax_expense_seasonal_change"
  },
  "units": "dimensionless corporate amounts / prior same-quarter assets",
  "availability": "Income latest report frontier from PIT=max(ann,f_ann,end). Balance supplies only visible q-4 denominator. Union of income/balance publication/revision events re-looks up all legs under that event PIT. No current-balance wait, no backward revision.",
  "missing_policy": "All required YTD legs finite, Q1=YTD without preceding FY subtraction; assets(q-4)>1e6. Real negative/zero tax retained. New invalid income frontier or required old-period revision replaces old state with NaN; no report fallback. Current income report end age<=550 calendar days.",
  "resource_budget_bytes": 3000000000,
  "resource_budget_unit": "decimal GB; 3 GB is 3000000000 bytes, not 3 GiB",
  "statistical_controls": "base8 + all-net-income single-quarter YoY / assets(q-4), prior effective tax rate, cash tax burden, SUE/sue_accel, R4 accrual q/TTM, qf_roa_yoy_change, asset YoY growth and net share supply. Separate explanatory regression substitutes pre-tax YoY for after-tax YoY; never both same-scale profit controls in one tax regression. Tax/P/NI accounting identity limits original information claims.",
  "spec": {
    "group": "research_financial_information",
    "fin_fields": [
      "income_tax",
      "total_assets"
    ],
    "desc": "Tax expense seasonal change may supplement after-tax profit change; weak positive 1/5-day prior, not independent of joint pre/after-tax accounting identity.",
    "formula": "[S(income_tax,q)-S(income_tax,q-4)]/point(total_assets,q-4); q is income latest disclosed frontier, not joint current frontier",
    "deps": [
      "stock_income",
      "stock_balancesheet",
      "stock_daily"
    ],
    "warmup_days": 1100,
    "higher_is_better": true,
    "version": 1,
    "note": "All required YTD legs finite, Q1=YTD without preceding FY subtraction; assets(q-4)>1e6. Real negative/zero tax retained. New invalid income frontier or required old-period revision replaces old state with NaN; no report fallback. Current income report end age<=550 calendar days. Float64 numerical computation, float32 Store; full fixed pool/date keys; only current traded/universe output mask. base8 + all-net-income single-quarter YoY / assets(q-4), prior effective tax rate, cash tax burden, SUE/sue_accel, R4 accrual q/TTM, qf_roa_yoy_change, asset YoY growth and net share supply. Separate explanatory regression substitutes pre-tax YoY for after-tax YoY; never both same-scale profit controls in one tax regression. Tax/P/NI accounting identity limits original information claims."
  }
}
