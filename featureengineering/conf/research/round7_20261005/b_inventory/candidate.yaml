    "note": "Both inventories finite nonnegative including real zero; A(q-4)>1e6; both strict four-single-quarter revenue TTMs finite and >1e6. No partial-sum TTM, no missing-to-zero. Invalid newly joint report or revision overwrites old state; no report fallback. Joint report end age<=550 calendar days. Float64 numerical computation, float32 Store; full fixed pool/date keys; only current traded/universe output mask. base8 + inventory_turnover, cash_conversion_cycle, R4 accrual q/TTM, sales YoY/acceleration, asset growth QoQ/YoY, TTM gross margin and YoY change, lag inventory/assets and zero-inventory business indicator, qf_roa/SUE. No posterior industry snapshots."
