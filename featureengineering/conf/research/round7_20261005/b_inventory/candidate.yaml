  "missing_policy": "Both inventories finite nonnegative including real zero; A(q-4)>1e6; both strict four-single-quarter revenue TTMs finite and >1e6. No partial-sum TTM, no missing-to-zero. Invalid newly joint report or revision overwrites old state; no report fallback. Joint report end age<=550 calendar days.",
