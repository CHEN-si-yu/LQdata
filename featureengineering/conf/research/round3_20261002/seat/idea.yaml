idea_id: r3_seat_idea_v1
hypothesis: 龙虎榜上榜席位的身份结构（机构/北向/游资/普通、席位集中度、席位重复出现、
  席位双向对倒、席位新面孔占比）在固定 2115 只主板池上，可能改善下一开盘 1/5 日排序；
  这些信息与「机构专用净买额」这一个已被占用的标签不同，属于席位身份维度。
mechanism: 五个事前固定机制 —— (1) seat_class_divergence：机构席位净买 - 游资席位净买，
  用窗口内全部上榜记录的买卖总额归一；(2) seat_concentration：净买入为正的席位记录之间的 HHI；
  (3) seat_persistence：具名席位在「本股票」上重复出现的记录占比；(4) seat_buy_sell_overlap：
  同一席位记录当日 min(买,卖)/(买+卖) 的窗口加总（对倒嫌疑）；(5) seat_novelty：
  首次出现的具名席位占全部具名席位记录的比例。
expected_direction: 机制1 true、机制2 false、机制3 true、机制4 false、机制5 true。
  方向在写第一行代码前固定，未按任何 IC/收益结果翻转。
target_horizons: [1, 5]
falsifiable: 若某候选与 dragon_tiger_org_net_20 / top_list_net_rate_20 / efx_top_imbalance /
  efx_top_amount_rate 的日截面秩相关 |rho| > 0.9 且无法论证新增信息在哪里，或 declared
  分年同号年数少于 7/9，或工程验证截断/增量不一致，则该候选不支持本假设。
fields:
  - stock_dragon_tiger.trade_date
  - stock_dragon_tiger.stock_code
  - stock_dragon_tiger.org_name
  - stock_dragon_tiger.buy_amount
  - stock_dragon_tiger.sell_amount
  - stock_dragon_tiger.net_buy_amount
  - stock_dragon_tiger.direction
origin: round3_lead_preregistered_idea_R3A
status: unvalidated_hypothesis
preregistered_data_rules: >
  席位名规范化与席位分类规则在看任何 IC 之前冻结在 research/families/r3_seat_v1.py 的
  normalize_seat / _is_institution / _is_northbound / HOT_MIN_PRIOR / COMPANY_ALIASES 常量里。
  稀疏事件口径：主口径为零填充（窗口内无上榜记录 = 0，语义为「未达上榜标准」），
  NaN 口径作为敏感性分析由执行者用同一因子值加掩码离线复算（先与框架 daily_metrics 对齐再报告）。
