  "availability": "唯一可用时点 = stock_holder_number.ann_date（end_date 只用于识别期次，从不作为可见日）。ann_date 落在非交易日时后移到下一个交易日。T 日只用 <=T 的后复权收盘价。stock_holder_number 在 conf/frequency.yaml 里 freq=irregular、date_field=end_date、delay_days=0 且 gap_checkable=false —— 本项目**没有**该表 ann_date 的公布时刻合同；公告日按『当日收盘后可知、次日起可用』的常规处理，属于保守方向（信号在公告生效日当天就用到了当日收盘价，而 ann_date 公告本身在盘中/盘后发布，这一点是本候选的残留 PIT 风险，见报告 §2.4）。",
