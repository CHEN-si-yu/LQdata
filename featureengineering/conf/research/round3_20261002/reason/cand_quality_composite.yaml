# R3-D 候选定义（关键词表见 research/families/r3_reason_text_v1.py 的 KEYWORDS 常量，已冻结）。
{
  "name": "r3r_quality_composite_v1",
  "family_id": "r3_reason_family_v1",
  "implementation": "research.families.r3_reason_text_v1:reason_taxonomy",
  "parameters": {"signal": "quality_composite"},
  "units": "整数分（-1..2），无单位。",
  "availability": "唯一可用时点是 stock_forecast.ann_date（与 fea/upstream.py 对 stock_forecast 的 announcement 截断口径一致）；ann_date < 1990-01-01 的行剔除。ctx.asof_daily(ann_date) 前向填充。stock_forecast.end_date 可指向未来报告期，绝不作为特征输入。",
  "missing_policy": "change_reason 为空/空白 -> NaN（与「未命中任何类别」严格区分）；文本非空但未命中该类别 -> 0.0；文本非空且命中 -> 1.0。同一 (stock, ann_date) 有多条预告记录时，当日该类别的取值取 max（任一记录命中即为 1）。窗口内首次预告之前 NaN，不填 0。",
  "closest_existing_baselines": ["forecast_type_score", "forecast_profit_midpoint_change", "forecast_profit_range_uncertainty"],
  "semantic_difference": "只用变动原因的文本驱动类型，不使用预告类型与任何幅度数值字段。",
  "source_fields": ["stock_forecast.ann_date", "stock_forecast.change_reason"],
  "pre_registered_direction": "higher_is_better",
  "spec": {
    "group": "r3_reason",
    "desc": "预告变动原因的合成质量分：主营 + 行业景气需求 − 非经常性损益",
    "formula": "(1{main_business} + 1{demand_cycle} - 1{nonrecurring}) over the latest readable forecast; NaN if the text is empty; asof to daily grid at ann_date",
    "deps": ["stock_forecast"],
    "start": null,
    "warmup_days": 400,
    "higher_is_better": true,
    "version": 1,
    "note": "R3-D 合成变体（任务书允许最多 2 个）；reason_impairment 因预登记命中率门槛未达标被排除在合成之外，该排除依据是命中率而非 IC。"
  }
}