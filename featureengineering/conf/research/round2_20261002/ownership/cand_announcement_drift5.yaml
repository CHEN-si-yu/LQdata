name: r2own_v2_announcement_drift5_v1
family_id: r2_ownership_family_v2
implementation: research.families.r2_ownership_v2:build
parameters: {signal: announcement_drift_d5}
units: 后复权收益之差（无量纲）；池内去均值用当日固定2115股池。
availability: 事件生效日 eff 由 ann_date 决定；T 日只使用 <=T 的后复权收盘价与 ann_date<=T 的公告。ann_date 落在非交易日时后移到下一个交易日。
missing_policy: 同一(signal 日股票)不在事件窗内 -> NaN；停牌/非真实成交日 -> NaN（成交量与收益不做前向填充）。完整输入但窗内漂移恰为0保留为0。
closest_existing_baselines: [holder_number_chg, log_mv, turnover_std_20, chip_concentration]
semantic_difference: 机制3 的 5 日窗口（预登记）。同日披露多个报告期只算一个事件。
source_fields:
  - stock_holder_number.ann_date
  - stock_holder_number.end_date
  - stock_holder_number.holder_num
  - stock_finance.circ_mv
spec:
  group: r2_ownership
  desc: R2-I3 机制3：股东户数公告日之后 5 个交易日内的池内相对漂移
  formula: value(T)=pool_demean(hfq_close(T)/hfq_close(eff)-1), 1<=交易日数(T-eff)<=5; eff=首个>=ann_date的交易日
  deps: [stock_holder_number, stock_daily, stock_adj_factor]
  warmup_days: 500
  higher_is_better: true
  version: 1
  note: v2 修正日期差单位（YYYYMMDD 相减 -> 真实日历天），机制/窗口/方向/阈值与 v1 完全相同；机制3 的 5 日窗口（预登记）。同日披露多个报告期只算一个事件。