# 事前登记定义；方向与机制在计算前冻结。
{
  "name": "r2_supply_free_float_ratio_v1",
  "family_id": "r2_supply_family_v3",
  "implementation": "research.families.r2_supply_v1:build",
  "parameters": {
    "signal": "free_float_ratio_level"
  },
  "units": "free_share/total_share 无量纲比例。",
