  "implementation": "research.families.r2_disclosure_v1:disclosure_timing",
  "parameters": {"signal": "earliness_last"},
  "units": "日历日（法定截止日 - 首次可得日）；无价格/金额单位。",
  "availability": "四张财报的同一报告期取最早可得日 avail = max(ann_date, f_ann_date, end_date)（与 fea/upstream.py 的截断审计口径逐字一致）；ann_date/f_ann_date 均早于 1990-01-01 的行按哨兵值剔除。用 ctx.asof_daily 从 avail 当日起前向填充到交易日网格，绝不用 end_date 作为可用时点。",
  "missing_policy": "该股在该报告期无任何可得记录 -> 该期无值；窗口内首次披露之前为 NaN（不前向填充、不填0）。首次可得日晚于法定截止日 60 天以上的报告期按供应商补录/重述剔除（EARLINESS_FLOOR=-60）。",
  "closest_existing_baselines": ["forecast_type_score", "forecast_profit_midpoint_change"],
