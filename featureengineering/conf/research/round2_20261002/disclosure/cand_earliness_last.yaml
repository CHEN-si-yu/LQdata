    "formula": "earliness = ordinal(deadline(end_date)) - ordinal(min_avail(end_date)); deadline: Q1 04-30, H1 08-31, Q3 10-31, FY 04-30(next year); asof to daily grid at min_avail",
    "deps": ["stock_income", "stock_balancesheet", "stock_cashflow", "stock_financial_indicator"],
