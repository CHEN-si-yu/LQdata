# 机制4 disclosure_gap：预告首发日到正式报告可得日的日历天数。
{
  "name": "r2d_disclosure_gap_v1",
  "family_id": "r2_disclosure_family_v1",
  "implementation": "research.families.r2_disclosure_v1:disclosure_timing",
  "parameters": {"signal": "disclosure_gap"},
  "units": "日历日（正式报告可得日 - 首次预告公告日）。",
  "availability": "配对键为 (stock_code, end_date)。预告侧取 ann_date 最小的那条记录的 first_ann_date；正式报告侧取四张财报同报告期的最早可得日 report_day = max(ann_date, f_ann_date, end_date) 的最小值。整条配对记录在 report_day 当日才可知（预告记录亦已可读），因此铺设在 report_day，不用预告日铺设。",
  "missing_policy": "该报告期缺预告或缺正式报告 -> 该期无值；gap<0（预告日晚于正式报告）或 gap>400 天（跨期补录）剔除；窗口内首次配对之前 NaN。",
  "closest_existing_baselines": ["forecast_type_score", "forecast_profit_midpoint_change"],
  "semantic_difference": "度量预告渠道与正式报告渠道之间的信息节奏，不用预告类型也不用盈余数值。",
  "source_fields": ["stock_forecast.ann_date", "stock_forecast.first_ann_date", "stock_forecast.end_date",
                    "stock_income.ann_date", "stock_income.f_ann_date", "stock_income.end_date",
                    "stock_balancesheet.ann_date", "stock_balancesheet.f_ann_date", "stock_balancesheet.end_date",
                    "stock_cashflow.ann_date", "stock_cashflow.f_ann_date", "stock_cashflow.end_date",
                    "stock_financial_indicator.ann_date", "stock_financial_indicator.end_date"],
  "pre_registered_direction": "higher_is_better",
  "spec": {
    "group": "r2_disclosure",
    "desc": "首次业绩预告到正式定期报告之间的日历天数",
    "formula": "gap = ordinal(min_report_avail(end_date)) - ordinal(first_ann_date of earliest forecast record); asof to daily grid at min_report_avail",
    "deps": ["stock_income", "stock_balancesheet", "stock_cashflow", "stock_financial_indicator", "stock_forecast"],
    "start": null,
    "warmup_days": 400,
    "higher_is_better": true,
    "version": 1,
    "note": "R2-I4 机制4；stock_forecast.end_date 只作配对键（可指向未来报告期），绝不作为特征输入。"
  }
}