name: r4d_rev5_x_mktvol_v1
family_id: r4d_state_interaction_v1
implementation: research.families.r4d_state_interaction_v1:build
parameters: {signal: rev5_x_mktvol}
units: 交互值为两个标准化量的乘积（无量纲）；股票腿来自短周期反转腿（−5 日后复权收益）的截面 winsor+zscore，市场腿为沪深300 20 日年化波动率的 252 日滚动 z。
availability: 只用信号日收盘及以前数据：价格腿用 T 日及以前的后复权收益；市场腿为 T 日收盘后可得的市场标量（index_daily 实测 delay_days=0）再过 252 日滚动 z（含 T）。无额外未来数据。
missing_policy: 任一腿缺失（停牌、未上市、窗口不足、市场序列缺失）→ 交互值 NaN；不零填充。252 日滚动 z 的 min_periods=120 由 mx 毒化语义保证（窗口内至少 120 个有限值）。
spec:
  group: research_interaction
  desc: 未验证候选（U4 机制1，方向预登记 true）：短周期反转腿 × 沪深300 波动状态的乘积。
  formula: value = z_cs(winsor_cs(−ret5)) × z_time(mkt_idx_csi300_volatility20,252,120)；z_time = (x−roll_mean252)/roll_std252, min_periods=120
  deps: [stock_daily, stock_adj_factor, index_daily, mkt_idx_csi300_volatility20]
  warmup_days: 500
  higher_is_better: true
  version: 1
  note: |
    市场父因子 mkt_idx_csi300_volatility20 按任务书进 deps（runner 会一并复算）。
    框架不允许股票因子经 ctx.load_factor 读 is_market 标量（fea/factors_io.py:62 守卫），
    市场腿在候选内部调用 factors.market._index 的同一实现在当前面板复算；
    交付侧会把候选复算值与 run 命名空间里父因子落盘值逐值对照。
