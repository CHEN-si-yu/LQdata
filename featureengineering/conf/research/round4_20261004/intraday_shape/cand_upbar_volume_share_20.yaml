name: r4b_upbar_volume_share_20
family_id: r4b_intraday_shape_v1
implementation: research.families.r4b_intraday_shape_v1:build
parameters: {signal: upbar_volume_share_20}
units: 无量纲份额 Σ(vol·w)/Σvol；份额口径对 vol 的手/股单位翻转（2025-12-01）严格不变。
availability: 只用信号日 15:00 收盘前当日 5min bar；不跨日、无未来数据；stock_history_5min
  经 fea/delay.py / conf/frequency.yaml 实测 delay_days=0，无需位移。
missing_policy: 当日可用 bar（vol 有限且 ≥0）<40 或 Σvol<=0 为 NaN；停牌/无该日分区为 NaN；
  不零填充。20 日窗内有效日 <15 为 NaN。平/不可判定 bar 记 0.5 权重（规则事前定死）。
spec:
  group: research_intraday
  desc: Lead 预登记机制 4：上涨 bar 成交量占比的 20 日均（上涨放量=主动买盘承接）。
  formula: mean20( (Σ_{close>open} vol + 0.5·Σ_{close==open 或方向不可判定} vol) / Σ_{全部可用 bar} vol )
  deps: [stock_history_5min]
  warmup_days: 45
  higher_is_better: true
  version: 1
  note: bar 方向 = bar 内 close vs open（非 bar 间收益）；方向不可判定（open/close 缺失）同样 0.5。
