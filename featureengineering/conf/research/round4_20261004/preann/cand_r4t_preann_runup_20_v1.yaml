name: r4t_preann_runup_20_v1
family_id: r4t_preann_v1
implementation: research.families.r4t_preann_v1:build
parameters: {signal: pre_ann_runup_20}
units: 累计池内超额收益（日算术收益 − 池内已成交股票截面均值，求和），无量纲。
availability: 公告前窗口只用到 T−1：E(p) 由去年同期首个披露时点（早 ≥1 年，整数位移 +10000）与法定截止日决定；窗口关闭取公告可见日（pit = max(ann_date, f_ann_date, end_date) 的次一交易日）前最后交易日，兜底 = 法定截止 + 60 日历天；窗口内只用 ≤T 的已实现收益。PIT/verify 一致性论证见模块 docstring（截断/两阶段增量逐值一致）。
missing_policy: 窗口外（该交易日不落在任何未公告报告期窗口内）为 NaN——「无即将公告」属结构性缺失，不零填充；未上市/无价格为 NaN；零填充口径仅作离线敏感性分析在 report 中双列报告。
spec:
  group: research_preann
  desc: 公告前抢跑：窗口内每个交易日的最近 20 个交易日累计池内超额收益（公告前抢跑强度的直译）。方向 false 事前冻结。
  formula: "active(T) = union_p [T in window(p)]; window(p) = [E(p)-20td, min(close_before(vis(p)), dl(p)+60cal)]; E(p) = min(first_vis(p-10000)+10000, dl(p)); runup(T) = sum_{k=0..19} shift(rel_ret, k), rel_ret = ret(1) - cs_mean(ret(1) | listed & traded)"
  deps: [stock_income, stock_daily, stock_adj_factor]
  warmup_days: 700
  higher_is_better: false
  version: 1
  note: 窗口长度 p50 ≈ 20 交易日、p90 ≈ 29（总长 mean 23.1）≪ warmup 700 日历天；覆盖为季节性稀疏（NaN 口径 1050/2123 个交易日 ≥100 只活跃，占 49.5%）；机制集合/方向/预算事前冻结，无变体额度。
