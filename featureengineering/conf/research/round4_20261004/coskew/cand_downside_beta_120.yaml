name: r4g_downside_beta_120_v1
family_id: r4g_coskew_v1
implementation: research.families.r4g_coskew_v1:build
parameters: {signal: downside_beta_120}
units: 无量纲 beta（仅下行日样本的 OLS 斜率：r 对 r_m 的回归系数）。
availability: 只用信号日 T 收盘及以前（含 T）的后复权日收益与池内当日等权均值；hfq 价只用 <=T 的 adj_factor（PIT 安全）；stock_daily / stock_adj_factor 不在 fea/delay.py 的 LAGGED_DATASETS（实测仅 stock_margin_detail），无需位移。
missing_policy: 窗口（120 日，含 T）内 r_m<0 且成对有效的交易日 <16 → NaN；n_down·Var(r_m|r_m<0) ≤ 1e-12 的退化窗口 → NaN（数值守卫）；停牌/未上市/当日无成交不参与窗口（不是 0 收益）；不填充、不外推。
spec:
  group: research_coskew
  desc: 机制 2 的窗口变体（120 日）：长窗下行贝塔（仅 r_m<0 日回归，对池等权市场）；高下行贝塔 → 预期收益更高。标注变体性质，不单列新机制主张。
  formula: beta_down = OLS slope of r ~ r_m on days with r_m < 0 (120d window incl. T, min 16 down days)
  deps: [stock_daily, stock_adj_factor]
  warmup_days: 240
  higher_is_better: true
  version: 1
  note: downside_beta_60 的窗口变体（min 16 个下行日 = 2×8）；其余口径与 downside_beta_60 完全一致。
