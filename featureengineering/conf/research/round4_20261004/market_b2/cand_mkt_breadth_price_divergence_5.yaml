name: r4n_mkt_breadth_price_divergence_5_v1
family_id: r4n_market_b2_v1
implementation: research.families.r4n_market_b2_v1:build
parameters: {signal: mkt_breadth_price_divergence_5}
units: 无量纲（两个 252 日滚动 z 的差）；宽度腿=上涨家数占比 5 日均，价格腿=等权池 5 日累计收益。
availability: T 日收盘后可用；只用当日及以前的日线（stock_daily / stock_adj_factor，delay=0）；两腿滚动窗口与 z252 只用 ≤T 的历史值；无未来数据。
missing_policy: 单日有效票 < 100 的 up_ratio / ew 记 NaN；5 日窗口内任一 NaN → 该日腿值 NaN（min_count=5）；z252 需 ≥120 个有限历史值否则 NaN；不零填充、不前向填充。
spec:
  group: market
  desc: "宽度-价格背离：z252(上涨家数占比 5 日均) − z252(等权池 5 日累计收益)（严格通道，方向 +1）"
  formula: "up=count(r>1e-12)/count(valid)（生产 mkt_up_ratio 同口径）；up5=MA5(up)；ew5=prod(1+ew,5)-1；z252(x)=(x-mean252(x))/std252(x,ddof=0), min_count=120；value=z252(up5)-z252(ew5)"
  deps: [stock_daily, stock_adj_factor]
  start: '2018-01-01'
  warmup_days: 500
  higher_is_better: true
  version: 1
  is_market: true
  note: "Round4-U11 严格通道预登记（方向 +1、先验弱-中，封存于 freeze b2 方向表）；z252 口径(min120)先于结果统计冻结；固定2115只主板池；有效样本分母，缺测/停牌不计，少于100只为NaN；市场标量不做截面rank；T日收盘后可用；缺失保持NaN不用未来值回填；防重蹈检查（对照 doc/市场因子清理记录_20261004.md 27 个已删市场因子）见 report.md；未承诺收益有效性，由 M0–M7 门序裁决。"
