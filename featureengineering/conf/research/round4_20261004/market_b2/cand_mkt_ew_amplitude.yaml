name: r4n_mkt_ew_amplitude_v1
family_id: r4n_market_b2_v1
implementation: research.families.r4n_market_b2_v1:build
parameters: {signal: mkt_ew_amplitude}
units: 无量纲（比例）；池内 (high−low)/pre_close 的等权均值（日频原值、不做平滑）。
availability: T 日收盘后可用；只用当日及以前的日线（stock_daily，delay=0）；用当日原始 high/low 与厂商 pre_close（已除权调整的前收对比口径）；无未来数据。
missing_policy: 停牌 / 缺价（high、low、pre_close 缺失或 pre_close<=0）不计入分母；有效票 < 100 的日 → NaN；不零填充、不前向填充。
spec:
  group: market
  desc: "池内平均振幅 mean((high−low)/pre_close)（绿卡描述量，无方向）"
  formula: "amp=(high-low)/pre_close（当日原始价）；value=mean(amp) over 有效票"
  deps: [stock_daily]
  start: '2018-01-01'
  warmup_days: 500
  higher_is_better: true
  version: 1
  is_market: true
  note: "绿卡通道预登记（无方向承诺）；『振幅』为绿卡允许清单逐字列举项；行内 (high-low)/pre_close 为振幅标准定义，非跨序列聚合的价差/比值构造（绿卡排除条款逐条比对见 freeze b2 edge_notes）；与生产 mkt_am_range_mean（上午口径）、mkt_idx_csi300_amplitude20（指数口径）的差异见 report.md；固定2115只主板池；有效样本分母，缺测/停牌不计，少于100只为NaN；市场标量不做截面rank；缺失保持NaN；未做收益有效性承诺。"
