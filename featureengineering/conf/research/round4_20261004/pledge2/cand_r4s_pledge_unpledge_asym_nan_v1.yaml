name: r4s_pledge_unpledge_asym_nan_v1
family_id: r4s_pledge_v2_v1
implementation: research.families.r4s_pledge_v2_v1:build
parameters: {signal: pledge_unpledge_asym_nan}
units: 无量纲比值，取值 [−1, +1]（增质幅度占总变差的比例再居中）。
availability: 周频快照 stock_pledge_stat；end_date 仅为截止日、无发布时刻；本模块进程内声明 end_date 为可得日期列（AGENTS.md F.1 绕行，已用 Upstream._audit_frame 实测截断生效）；as-of 只前向填充，整体保守滞后 15 个交易日（> 实测供应商滞后 12–13 个交易日）；lag<13 的口径被禁。
missing_policy: NaN 敏感性口径：缺席不记 0——只在真实报告行上 as-of（无新报告沿用最近一次报告值；从未报告 = NaN）；65 日窗口内路径不完整（含未报告段前段）滚窗结果为 NaN；U+D=0 记 NaN。与 zero 口径符号翻转 ⇒ 按 B3 判不支持。
spec:
  group: research_pledge
  desc: 增质/解质路径不对称（NaN 口径）：同 pledge_unpledge_asym 公式 (U−D)/(U+D)（65 交易日窗口），但 P 只在真实报告行上 as-of（缺席不记 0）。双口径并列报告；值越高 = 增质主导，预期未来收益越低。
  formula: "(U-D)/(U+D), U=roll_sum(max(dP,0),65), D=roll_sum(max(-dP,0),65), P=lag15(asof_reportsonly(...)), U+D=0 -> NaN"
  deps: [stock_pledge_stat]
  warmup_days: 400
  higher_is_better: false
  version: 1
  note: 与 pledge_unpledge_asym 仅缺省口径不同（R3 伪发现模式 5 要求的双口径对照，framework-grade）；方向与主口径一致、事前冻结；严禁 lag5 前视口径。
