hypothesis_boundary: >
  与 v1 家族相同：市场标量没有同日股票间排序，不计算虚构的横截面 IC；绿卡通道 M0∧M2∧M3
  （描述性上下文量，无方向承诺）；规则与控制集继承批 1/批 2 的 round4 freeze 链，不重开任何阈值。
  本族仅承载 r4o_market_b3_v1 的工程修复重发布（fix1），不引入任何新机制。
search_policy: 仅 1 个重发布候选；不扩窗口、不改参数、不改方向；z252 口径（min_count=120）与
