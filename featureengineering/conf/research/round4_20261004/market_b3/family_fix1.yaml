baseline: >
  与 v1 家族（r4o_market_b3_v1）完全相同：严格候选朴素对照 = 量腿与价格腿的近亲生产因子
  （mkt_amount_total_log 存量能水平、mkt_illiquidity_median 量能/冲击水平、mkt_ew_reversal_5
  的价格腿口径〔批 1 市场单元候选〕、mkt_idx_csi300_ret1 / mkt_idx_csi300_momentum20 指数价格腿）
  与 b2 严格候选 mkt_breadth_price_divergence_5（宽度侧背离）；控制集 v1（继承 r4m round4 freeze，
  不得改动）。本族为**纯工程修复的重发布**：v1 家族候选 mkt_amount_median
  （r4o_mkt_amount_median_v1_88ac1e24a25fdb20）在 smoke（2025-01-01..2025-12-31 短窗）被引擎
  拒绝写入——候选 yaml deps 仅声明 stock_daily，而实现掩码（universe & finite(ret_clean)）
  实际读取 stock_adj_factor，触发「实际读取了未声明依赖，拒绝写入以免增量漏算」
  （trial_failed，run r_e19e88213e9a4efe80520c913e38ade2，rc=1，无任何产出）。fix1 =
  v1 + deps 补正（[stock_daily, stock_adj_factor]）；候选公式、参数、方向（绿卡无方向）、
  缺失口径与预登记完全一致，不构成新机制、不改变有效预算计数（预算 1 = 该重发布候选）。
allowed_variants:
