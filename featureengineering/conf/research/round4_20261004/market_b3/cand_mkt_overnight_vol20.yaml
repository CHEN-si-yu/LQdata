name: r4o_mkt_overnight_vol20_v1
family_id: r4o_market_b3_v1
implementation: research.families.r4o_market_b3_v1:build
parameters: {signal: mkt_overnight_vol20}
units: 无量纲（收益率小数的标准差）；池内等权隔夜收益的 20 日滚动标准差。
availability: T 日收盘后可用；只用当日及以前的日线（stock_daily，delay=0）；用当日原始 open 与厂商 pre_close（已除权调整的前收对比口径）；滚动窗口只用 ≤T 的历史值；无未来数据。
missing_policy: 停牌 / 缺价（open、pre_close 缺失或 pre_close<=0）不计入分母；有效票 < 100 的日记 NaN；20 日滚动窗口至少 15 个有限值，否则 NaN；不零填充、不前向填充。
spec:
  group: market
  desc: "池内等权隔夜收益的 20 日滚动标准差（绿卡描述量，无方向）"
  formula: "ov=open/pre_close−1（当日原始价）；nightly=mean(ov) over 有效票；value=std20(nightly, ddof=0), min_count=15"
  deps: [stock_daily]
  start: '2018-01-01'
  warmup_days: 500
  higher_is_better: true
  version: 1
  is_market: true
  note: "绿卡通道预登记（无方向承诺）；收益率（隔夜口径）与波动率为绿卡允许清单列举的标准变换/统计量（波动率）；隔夜收益聚合为池内均值再取 20 日滚动标准差（单序列波动描述）；与批 1 绿卡 mkt_overnight_ret（隔夜收益水平）为同输入的不同统计量（水平 vs 波动），差异见 report.md；固定2115只主板池；有效样本分母，缺测/停牌不计，少于100只为NaN；市场标量不做截面rank；缺失保持NaN；未做收益有效性承诺。"
