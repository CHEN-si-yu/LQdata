name: r4f_corwin_schultz_spread_20_v1
family_id: r4f_spread_micro_v1
implementation: research.families.r4f_spread_micro_v1:build
parameters: {signal: corwin_schultz_spread_20}
units: 无量纲（收益率的相对比率）；high/low 均取后复权价，比值消去复权单位。pair = 2(e^α−1)/(1+e^α) 为隐含价差相对值。
availability: 只用信号日收盘及以前的日线（adj_factor 取截至当日累计值）经 PriceLayer 后复权；相邻两日的 high/low 都在信号日及以前；不读前复权；stock_daily/stock_adj_factor 不在可得性滞后名单，无需 lagged_ok。
missing_policy: 相邻两日（t−1,t）中任一日非真实成交（vol 缺失或 ≤0）或 high/low 缺失/非正/高<低时 pair 为 NaN；单日 pair 为负截 0（论文口径）；日度序列 = 0.5·(pair_t + pair_{t−1})，缺一个 pair 即 NaN；窗口（20）内有效日 <15 为 NaN；不零填充。
spec:
  group: research_spread_micro
  desc: 未验证候选：Corwin–Schultz(2012) 高低价隐含价差，20 日窗口，因果化日度序列。
  formula: pair=2(e^α−1)/(1+e^α)，α=(√(2β)−√β)/(3−2√2)−√(γ/(3−2√2))，β=ln(H/L)²两日之和，γ=ln(maxH/minL)²；日度=0.5·(pair_t+pair_{t−1})（论文级数后移一日，不用未来）；窗口 20 日均值 min_count=15
  deps: [stock_daily, stock_adj_factor]
  warmup_days: 70
  higher_is_better: true
  version: 1
  note: 方向与参数预登记；研究候选，不进生产；无未来有效性证明。
