name: r4f_roll_spread_20_v1
family_id: r4f_spread_micro_v1
implementation: research.families.r4f_spread_micro_v1:build
parameters: {signal: roll_spread_20}
units: 价格为后复权价（元），r 为价格层简单收益（无量纲）；因子值 = 2·sqrt(max(−cov,0))，量纲回到收益率（小数），与金额类非流动性因子（Amihud）不同源、不可直接相加。
availability: 只用信号日收盘及以前的日线（adj_factor 取截至当日累计值）经 PriceLayer 后复权；不读前复权；stock_daily/stock_adj_factor 不在可得性滞后名单（fea/delay.py 实测），无需 lagged_ok。
missing_policy: 窗口（20 交易日）内有效收益配对 <15（75%）为 NaN；t 或 t−1 非真实成交（vol 缺失或 ≤0，hfq 下停牌日被前向填充）不入配对；价格层 |单日收益|>60% 的脏数据置 NaN；协方差 ≥0 时按「未检出价差」边界取 0.0（敏感性变体 roll_spread_20_nan 取 NaN，独立汇报）；其余缺失不填充。
spec:
  group: research_spread_micro
  desc: 未验证候选：Roll(1984) 有效价差 20 日滚动估计，主口径（cov≥0 → 0.0）。
  formula: 2*sqrt(max(-cov(r_t, r_{t-1}), 0))；cov 为尾部 20 个有效配对的总体协方差（ddof=0），min_count=15
  deps: [stock_daily, stock_adj_factor]
  warmup_days: 70
  higher_is_better: true
  version: 1
  note: 方向与参数预登记；研究候选，不进生产；无未来有效性证明。
