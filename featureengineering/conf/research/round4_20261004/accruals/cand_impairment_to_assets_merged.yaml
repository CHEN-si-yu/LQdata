name: r4c_impairment_to_assets_merged_v1
family_id: r4c_accruals_v1
implementation: research.families.r4c_accruals_v1:build
parameters: {signal: impairment_to_assets_merged}
units: 无量纲比率（单季资产减值+信用减值/总资产）。正值=单季净计提，负值=单季净转回。
availability: assets_impair_loss（利润表）与 credit_impa_loss（现金流量表补充资料）累计值各自取 pit≤信号日最新版本；单季=|cum(q)|−|cum(q−1)|（q 为 Q1 时单季=|cum(q)|）；总资产取公告时点值；无未来信息。
missing_policy: 两类减值任一累计值不可考（Q1 只需 q）、总资产不可考或 |总资产|≤1e6 元时为 NaN；非有限值输出为 NaN。
spec:
  group: research_accruals
  desc: 未验证候选（U3 机制4变体）：合并信用减值损失口径的减值强度。
  formula: (|cum(assets_impair_loss,Q)|+|cum(credit_impa_loss,Q)| − |cum(assets_impair_loss,Q−1)|−|cum(credit_impa_loss,Q−1)|) / point(total_assets)
  deps: [stock_income, stock_cashflow, stock_balancesheet]
  fin_fields: [total_assets]
  warmup_days: 500
  higher_is_better: false
  version: 1
  note: 方向事前冻结 false；与机制4主候选的口径范围对照（2019 格式切换后信用减值从资产减值中拆出）；字段覆盖实测 stock_cashflow.credit_impa_loss 池内 100% 非空。
