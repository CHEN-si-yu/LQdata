{
  "name": "r6c_cash_supported_project_completion_v1",
  "family_id": "r6c_project_completion_v1",
  "implementation": "research.families.r6c_project_completion_v1:build",
  "parameters": {
    "signal": "cash_supported_project_completion",
    "window": 4
  },
  "units": "无量纲；raw可为零",
  "availability": "仅季度末报表。pit=max(ann_date,f_ann_date,end_date)；须有可考公告日期，保留同报告期不同公告日版本。两表每期共同可得日=max(首BS pit,首CF pit)，Q=当前已共同披露报告期的前缀最大值；全BS/CF后续公告与修订事件用同一Q和当时pit重查每个所需历史期，旧期修订不使Q倒退。BS多个科目按同一整行报告版本汇合，不能分别沿用旧的非空分量。公告后的交易消费遵循官方协议，供应商未留旧版不能重构。每日以Q季度末到ctx面板日的自然日年龄>550置NaN。",
  "missing_policy": "至少5个连续BS季度末点和4个连续单季经营净现金流有效；CF按财年YTD差分，Q1=当期累计，其他季度=当期累计-同财年前季累计，缺中间季即NaN，即使三行TTM可得也禁止fallback。严格4单季OCF和>0为资格条件；缺失不零填充、窗口不删行、不回退较旧有效Q；新无效公告/修订事件明确NaN覆盖旧信号。五个cip_total/fix_assets均有限非负；四个前期cip_total平均>1e6元。真实终期零值保留，净固定资产折旧可能掩盖真实转固，非配对变化贡献为0。",
  "spec": {
    "group": "research_financial_dynamics",
    "desc": "有正经营现金支撑时，在建工程下降与固定资产增加的同期配对表示工程投入开始形成可运营资产，减少闲置在建资金，预期横截面收益更高；方向为事前机制先验，未验证。",
    "formula": "matched_k=min(max(I_(k-1)-I_k,0),max(F_k-F_(k-1),0)); raw=sum(k=Q-3..Q,matched_k)/mean(k=Q-3..Q,I_(k-1))",
    "deps": [
      "stock_balancesheet",
      "stock_cashflow"
    ],
    "warmup_days": 1100,
    "higher_is_better": true,
    "version": 1,
    "note": "已删bs_construction_capital_share是静态CIP/(CIP+固定资产)，本项为连续季末相反变化的非线性配对，非静态占比。已删年度capex/depr比变化及R5收入收现相关均非本机制；不使用SG&A、借还现金流周转或筹码持仓成本。 严格float64计算，官方Store转float32；保留2018起完整交易日轴和冻结2115股键，不可删NaN行。raw/declared方向同正；rank FM和消费变换FM双口径。"
  }
}
