    "desc": "上涨侧的脆弱价格冲击",
    "formula": "z_past_upside60(log(abs(pool_relative_return)+1e-6)-log(amount/prior60_mean_amount)), active only relative_return>0",
    "deps": [
      "stock_daily",
      "stock_adj_factor"
    ],
    "start": null,
    "warmup_days": 240,
    "higher_is_better": false,
    "version": 1,
    "note": "selection_20261001_v1；冲击为log(|池偏离收益|+1e-6)-log(当日成交额/过去均值)；侧创新clip±8。池偏离为固定池当日有效样本等权去均值，不是行业或完整beta中性。所有方向事前冻结，候选注册不等于生产批准。完整依赖先60交易日成交额基线、再60交易日冲击基线，需120个历史交易日。实际本地交易日历显示180日历预热存在不足边界；工程预热改240日历，最少有效样本与收益方向不变。"
