name: r9a_sec_own_rv_beta_v2
family_id: r9_sec_intraday_family_v2
implementation: research.families.r9a_sec_intraday_v1:build
parameters: {signal: sec_own_rv_beta, window: 60, min_count: 54}
units: >-
  无量纲（回归系数）。板块日内 RV 是当日 5 分钟对数收益的平方和开方，单位与日收益同量纲；
  beta = Cov_60(r_i, RV_s)/Var_60(RV_s)。
availability: >-
  tdx_minute 声明 delay_days=0，bar 时间戳覆盖 09:35..15:00，即 T 日全部 bar 在 T 日收盘时
  已完整落地；T 日因子值只使用 T 日及以前的 tdx_minute 与 T 日及以前的个股收益，T+1 开盘交易，
  无未来位移、无向后填充。★ 截断自证（tools/prove_truncation_tdx.py，2026-10-05 实测）：
  cutoff=20240628 下 tdx_minute 2024 分区 6,749,232 行 -> 3,222,048 行；full 中 day>cutoff
  的 3,527,184 行**全部消失**（泄漏 0 行），day<=cutoff 的行**一行未丢**（丢失 0 行），
  截断后最大日 = 20240628 —— 截断确实生效，不是 no-op（若为 no-op，前缀比较会平凡通过）。
  ★ 已知限制（前视，如实披露而非当作事实）：dd 行业映射用 stock_list.industry，该表是当前
  快照、无 as-of 日期；行业分类是**回溯应用**的，这是分类层面的前视。stock_list 在
  Upstream._audit_columns 中被白名单为 mode="contract"（日历/轴契约，非信息快照），
  因此不参与截断；其 frequency.yaml 声明的 date_field=trade_date 在 parquet schema 中
  并不存在，但因 mode="contract" 不会抛 ValueError（已实测，5910 行截断前后不变）。
missing_policy: >-
  逐 (board, day) 聚合，缺则该板块日 RV = NaN，绝不前向填充。行业无法解析到 board 的个股
  （实测 0 只）整列为 NaN。滚动窗口要求 60 日中至少 54 日同时有 r_i 与 RV_s，否则 NaN；
  个股停牌日 r_i 缺失会消耗窗口配额，因此长期停牌股的覆盖率会下降（如实报告）。
  每日首根 bar 无前收盘被丢弃；RV 由 47 个收益计算。close<=0 或非有限的 bar 一律丢弃。
  beta 只做 Var>1e-12 保护，不做零填充、不做截面填充。
closest_existing_baselines: [vol_120, idio_vol_60]
source_fields:
  - tdx_minute.board_code
  - tdx_minute.board_name
  - tdx_minute.trade_time
  - tdx_minute.close
  - stock_list.stock_code
  - stock_list.industry
  - stock_daily.close
  - stock_adj_factor.adj_factor
spec:
  group: r9_sector_intraday
  desc: >-
    个股对其**自身行业板块**日内已实现波动率（tdx_minute 5 分钟线）的 60 日滚动 beta。
    higher_is_better=false：对行业日内波动暴露越高，下一期收益越低（低风险异象）。
  formula: >-
    RV_s(t)=sqrt(sum_m log(c_{s,m,t}/c_{s,m-1,t})^2) over the 48 five-minute bars (first bar
    dropped); beta_i(t)=Cov_60(r_i, RV_s(i))/Var_60(RV_s(i)), s(i) from
    stock_list.industry == tdx_minute.board_name
  deps: [tdx_minute, stock_list, stock_daily, stock_adj_factor]
  warmup_days: 200
  higher_is_better: false
  version: 1
  note: >-
    去重论证（显式）：doc/因子清理记录_20261003.md L1602/1609/1616 是三个已删除的
    field_markets 因子 — corr60(ret_clean_hfq, cross_index_median(tdx_minute.amplitude |
    volume_concentration | weighted_pressure))。它们是**个股级**滚动暴露（不是 Lead 简报
    所称的市场级因子），回归量为全板块中位数、且其原定义备注明写「不读取当前板块成分」
    「不直接把所有股票相同的市场序列输出为因子」。本候选差异有二：(a) 回归量是**个股自身
    行业**的状态，**截面异质**，衡量行业特异信息冲击暴露而非全市场日内波动暴露；
    (b) 状态量是日内已实现波动率，不是 amplitude / volume_concentration / weighted_pressure。
    与 vol_120 / idio_vol_60 的差异：那两个是收益自身二阶矩，本因子是**对行业波动状态的
    回归系数**，不随个股自身波动幅度单调（分子分母同时缩放）。tdx_minute 在 177 因子
    正式库零引用。★ 逆风披露：该族两个已删除兄弟未过 IC 门槛、第三个过了 G1–G7 仍因机制
    论证不足被移除 —— 本候选不得以「过闸门」为通过理由。
