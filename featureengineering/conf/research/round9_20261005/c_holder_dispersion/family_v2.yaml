family_id: r9c_holder_dispersion_family_v2
idea_id: r9c_holder_dispersion_idea_v1
trial_budget: 2
allowed_variants:
  - {signal: abnormal_dispersion_shift, z_lookback: 8, z_min_prior: 4}
  - {signal: abnormal_dispersion_shift_k4, z_lookback: 4, z_min_prior: 3}
baseline:
  - holder_number_chg
  - r2own_v2_trend_persistence_v1
  - log_mv
  - turnover_std_20
  - chip_concentration
  - momentum_120
  - short_term_reversal_5
hypothesis_boundary: 只研究 stock_holder_number 一个数据维度上的「时间序列标准化的异常分散位移」一个机制。
  holder_number_chg 占用「单期变化率」，r2own_v2_trend_persistence_v1 占用「最近 4 期下降持续性与趋势强度」，
  两者均不含任何波动率归一；本 family 必须实测论证与这两者的差异。不扩参数网格、不事后调阈值、不事后改方向。
  K=4 变体是**事前登记**的窗口稳健性对照（与 R2 的 announcement_drift_d5/d10 同一做法），不是事后挑选；
  准入判定以主口径 K=8 为准，K=4 仅用于观察结论对历史窗长的敏感性。
search_policy: 两个口径在同一模块内事前冻结（FROZEN 字典），build() 拒绝任何其它参数组合；不存在被搜索的窗口。
v1_defect_disclosure: |
  family v1（r9c_holder_dispersion_family_v1，2 个已登记候选
  r9c_abnormal_dispersion_shift_v1_b08cde8f1558903f 与
  r9c_abnormal_dispersion_shift_k4_v1_c23af92dd4c18e49）的实现模块存在一处**类型缺陷**：
  `research/families/r9c_holder_dispersion_v1.py` 第 149 行写成
  `uniq_end, _ = np.unique(end)`，而 `np.unique(arr)` 只返回一个数组
  （只有带 `return_index=` 等标志时才返回元组），因此 `research run` 在
  `fea/engine.py:1040` 调用 builder 的第一步即抛
  `ValueError: too many values to unpack (expected 2)`，**9 秒即失败**。
  实测证据：`artifacts/research/runs/r_56a0d092a545422c823c9cf347b034d2/failure.json`
  （主口径，2026-10-05T07:40:59Z）与 _k4 口径的同型失败。
  该缺陷**从未产出任何因子值、从未计算任何 IC 或收益**，因此 v1 的两个候选
  不构成任何试验消耗、也不存在"看到结果后改定义"的问题；缺陷由执行者自查发现并由 Lead 独立复核。
  v2 只把该行改成 `uniq_end = np.unique(end)`（下方 `day_of` 构造只用 `uniq_end`，
  不需要逆索引），**机制、窗口、方向、阈值、PIT 合同、缺失口径与 v1 逐字相同**。
  v1 定义、v1 模块与失败 run 的 failure.json 按不可变原则原样保留，不删除、不复用。
