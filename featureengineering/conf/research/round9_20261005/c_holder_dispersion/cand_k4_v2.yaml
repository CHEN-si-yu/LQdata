name: r9c_abnormal_dispersion_shift_k4_v2
family_id: r9c_holder_dispersion_family_v2
implementation: research.families.r9c_holder_dispersion_v1:build
parameters: {signal: abnormal_dispersion_shift_k4, z_lookback: 4, z_min_prior: 3}
units: 无量纲（该股自身历史户数变化尺度下的标准差倍数）
availability: |
  与主口径完全相同的 PIT 合同：唯一可用时点 = ann_date，T 日只用 ann_date <= T 的记录；
  end_date 只用于确定"哪一期更新"。本表 ann_date 在 fea/upstream.py::_audit_columns
  白名单内，verify 的 audit_cutoff 走原生 "announcement" 分支截断，无需框架绕行。
missing_policy: |
  与主口径完全相同，仅历史窗长不同：可用历史变化数 < 3，或历史标准差 <= 1e-12 -> NaN 且不发射事件。
  holder_num <= 0 无效；相邻报告期间隔必须落在 (0, 200] 真实日历天。
  不做前向填充成交、不用 0 顶替 NaN。
source_fields:
  - stock_holder_number.stock_code
  - stock_holder_number.ann_date
  - stock_holder_number.end_date
  - stock_holder_number.holder_num
spec:
  group: r9c_holder_dispersion
  desc: R9-C1 异常分散位移的事前登记窗口稳健性变体：历史窗 K=4（最少 3 个历史变化），其余定义与主口径逐字相同
  formula: "z = (d_0 - mean(d_{1..4})) / std(d_{1..4}, ddof=1), 需要 >= 3 个历史变化且 std > 1e-12"
  deps: [stock_holder_number]
  warmup_days: 500
  higher_is_better: false
  version: 1
  fin_fields: [revenue]
  note: |
    【地位】事前登记的**窗口稳健性对照**，与 R2 的 announcement_drift_d5/d10 同一做法（在 family 的
    allowed_variants 里冻结，不是事后挑选）。准入判定以主口径 K=8 为准；本变体只用于回答
    "结论对历史窗长是否敏感"，不用于挑选更好的那个。
    机制、方向、PIT 合同、缺失口径与主口径逐字相同，仅 z_lookback 与 z_min_prior 不同。
    【fin_fields 说明】同主口径：不使用财务字段，为限制引擎"全建"而声明未使用的占位字段 revenue。
    【v2 修订（实现缺陷修复，非定义变更）】同主口径：v1 模块第 149 行的 np.unique 解包类型缺陷导致 run 9 秒失败，v1 从未产出任何因子值、从未计算 IC，不构成试验消耗。v2 仅修正该行，其余逐字相同。
