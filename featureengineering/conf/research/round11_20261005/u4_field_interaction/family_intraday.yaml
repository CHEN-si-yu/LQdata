family_id: r11u4_intraday_interaction_family_v1
idea_id: r11u4_intraday_interaction_idea_v1
trial_budget: 1
allowed_variants:
  - {signal: intraday_shape_x_volume_concentration}
baseline:
  - intraday_vol_ratio_5d（腿，在产）
  - r4b_intraday_volume_hhi_20（状态，在产）
  - r3b_intraday_rv_skewness_v2（同族已准入，无条件量）
  - log_mv
  - turnover_std_20
hypothesis_boundary: |
  只研究日内族**同族两字段**的条件交互一个机制。不扩参数网格、不事后调阈值、不事后改方向。
  P2/P3 是登记前提：腿 t = +1.69（不显著）；P3 IC+ = +0.00517 (t=+3.37) vs IC− = −0.00480 (t=−2.67)，
  差值 HAC t = **+5.94**，两状态符号相反且各自显著。
  状态必须 stock-varying（附录 K）：广播态会使候选退化为自身腿的有符号置换。
search_policy: 唯一口径在模块内事前冻结（SIGNALS/PAIRS），build() 拒绝任何其它参数组合。
v1_defect_disclosure: 不适用（首次登记；预筛先于登记完成）。
missing_convention_note: |
  附录 J 规则 4 不适用：两腿都是稠密在产因子，无零填充/NaN 可选约定；缺失一律传播为 NaN。
