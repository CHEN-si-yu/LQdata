  stock_daily_dump:
    freq: minute
    date_field: trade_date
    delay_days: 0
    gap_checkable: false
    note: ★ 产出目录是 stock_dump_5min（**非 spec 名**，见 main.py:_orphan_datasets）。 受最近 90
