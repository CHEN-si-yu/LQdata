# 日频横截面因子工程。所有产物与输入合同均位于本项目；上游原始数据只读。
paths:
  upstream: ../datadownload/data
  factors: data/factors
  state: state
  logs: logs
  market_factors: data/market_factors
  derived: data/derived
  artifacts: artifacts
  frequency: conf/frequency.yaml
  delay_history: state/delay_history.json
  production_registry: conf/production.json
universe:
  main_board_prefixes:
  - '600'
  - '601'
  - '603'
  - '605'
  - '000'
  - '001'
  - '002'
  - '003'
  exclude_st: true
  min_listed_days: 0
  frozen_list: conf/universe_frozen.tsv
default_start: '2018-01-01'
compute:
  kernel_version: 1
  revision_days: 10
  dep_backfill_days:
    stock_income: 500
    stock_balancesheet: 500
    stock_cashflow: 500
    stock_financial_indicator: 500
    stock_holder_number: 500
    stock_forecast: 500
    stock_pledge_stat: 500
    stock_daily: 20
    stock_adj_factor: 20
    stock_finance: 20
    stock_main_fund_flow: 20
    stock_margin_detail: 20
    stock_cyq_perf: 20
    stock_cyq_chips: 20
    stock_history_5min: 20
    index_daily: 20
    stock_limit_up: 20
    stock_limit_list: 20
    stock_top_list: 20
    stock_dragon_tiger: 20
    stock_suspension: 20
    default: 60
rank:
  winsor:
  - 0.01
  - 0.99
  min_cross_section: 100
storage:
  compression: zstd
resources:
  # 持久计算进程；默认并行度受 max_jobs 和 CPU 配额限制，显式 --jobs 正整数覆盖上限。
  # 显式 --jobs 正整数也豁免下列内存保护；不传或传 0 时保留全部保护。
  default_jobs: 12
  max_jobs: 20
  memory_budget_gib: 90
  process_address_space_gib: 24
  # 自动模式中新任务的内存预留；实际在途任务数量根据 cgroup 内存动态收缩。
  worker_memory_gib: 3
