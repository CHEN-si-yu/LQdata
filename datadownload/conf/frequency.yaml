但 audit.py 的 (D) 新鲜度检查会在补齐后报『滞后 0 != 声明 1』—— **那是正常现象，不是错误**。\
⚠️ 该表是 per_entity、done 为实体级不分年份，所以**补齐后必须手工回填**，增量不会自动补。\
另：09-08/09-09 两天真实缺口已于 2026-09-13 修复"}
  stock_margin_detail:      {freq: daily_full,    date_field: trade_date,  delay_days: 1, gap_checkable: true,
