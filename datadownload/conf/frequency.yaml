# 数据集更新频率与增量策略 —— 机器可读表
# ============================================================================
# 这是 QUANT_PLATFORM.md §16.4 / TASKS.md §六 「任务 2」的产物，也是任务 3、4 的基础。
#
# 为什么需要它：完整性检查**必须按数据类型区分判据**，否则会把
# 「不定期表本来就没有数据」误判成「缺失」，或者反过来漏掉真缺口。
#   · 日频·全样本：每个交易日都该有稳定行数 → 缺一天就是异常
#   · 日频·稀疏/事件：每个交易日都有行，但**行数波动很大**（涨停家数 40~95）
#     → 可以用「日期是否存在」判缺口，但**不能**用「行数 = 0」判
#   · 不定期/季频/月频：本来就不连续 → 只能对账 coverage，不能按交易日逐日要求
#
# freq 取值：
#   daily_full      日频·全样本（每个交易日全市场）
#   daily_sparse    日频·稀疏/事件（每天有行但行数波动）
#   weekly_monthly  一张表混了周线+月线，靠 period 列区分 ★ 特殊
#   monthly         月频
#   quarterly       季频（按报告期，注意还要看 ann_date 的 PIT 语义）
#   irregular       不定期（按公告）
#   minute          分钟级
#   snapshot        快照/一次性（无时间维度，不参与缺口判定）
#
# delay_days：该表的数据比"最后交易日"晚几个交易日才可得。
#   ⚠️ 目前是**单时点观测**（2026-09-13 周日一次，见 QUANT_PLATFORM.md §16.3 附录），
#      任务 3 要用连续观测（state/delay_history.json）把它固化成恒定值。
#   ⚠️ 这个字段是**模块② 因子可得性锚定**的依据：任何用到 delay>0 的表做因子，
#      都必须把因子值的「可得日」锚定在 T+delay，否则 T 日的因子值会在数据到达后**静默改变**。
#
# gap_checkable：能否用「交易日历 vs 实际有数据的日期」来判定缺口。
#   快照表没有时间维度 → false；其余为 true。
# ============================================================================

version: 1
updated_at: "2026-09-13"

