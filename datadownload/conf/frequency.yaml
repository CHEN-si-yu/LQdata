  # ------------------------------------------------- 2026-09-13 用户拍板：新启用/新增的 4 个
  # ⚠️ 这四个**一律不能标 daily_full / daily_sparse**，理由见下（这是本轮最重要的一条约束）。
  #
  #    闸门语义（gate.check :98 + main.py :191-194）：
  #        ok = 该表 max_date >= 基准表往前推 delay_days 个交易日
  #        ready = all(ok)；不 ready 且等满 4 小时 → **return 3，一个数据集都不下**。
  #    且 **max_date 是 None（从未下载过）时 ok 恒为 False**。
  #
  #    实测三条硬证据：
  #      1) stock_cyq_chips / stock_history_5min 走 per_entity，**没有回刷窗口** ——
  #         回填完成后全部实体 done，每天 0 任务、max_date 永久冻结 → 标 daily_* 会
  #         让每天的普通增量**永久 exit 3**（不是"白等 4 小时"，是整个任务跑不起来）。
  #      2) stock_market_distribution_history 实测**最新交易日返回 0 行**
  #         （2026-09-13 探测：09-11 与 09-09 均为空，09-10 有 241 行）→ max_date 落后
  #         → 标 daily_* 同样永久阻塞。
  #      3) stock_daily_dump 受"仅最近 90 天"窗口 + 每日期 10 次配额约束，语义上不是日频表。
  #
  #    所以四个一律用 minute / irregular，显式排除在闸门之外。
  stock_market_distribution_history:
    {freq: minute, date_field: trade_time, delay_days: 0, gap_checkable: false,
     note: "分钟级（241 行/日，trade_time 是完整 datetime）。★ 故意不进闸门：
            实测最新交易日会返回 0 行（上游发布滞后），标 daily_* 会让闸门永久阻塞、日更 exit 3。
            逐日增量有 revision_days=10 的回刷窗口兜底，能自愈。
            起点 2010-01-04 已由 predrop manifest + 2026-09-13 探测双重证实。"}
  stock_cyq_chips:
    {freq: irregular, date_field: trade_date, delay_days: 0, gap_checkable: false,
     note: "★ 语义上是日频，但 per_entity 无回刷窗口 → 回填完 max_date 不再前进，
            标 daily_* 会让闸门永久阻塞（见上方说明）。等 per_entity 回刷窗口实现后再改 daily_sparse。"}
  stock_history_5min:
    {freq: minute, date_field: trade_time, delay_days: 0, gap_checkable: false,
     note: "个股 5min 分时，逐股拉。★ 不进闸门（同 per_entity 无回刷窗口）。
            加 1min 时须另建 stock_history_1min —— 两个级别不能共用 data/ 目录（主键会撞）。"}
  stock_daily_dump:
    {freq: minute, date_field: trade_date, delay_days: 0, gap_checkable: false,
     note: "★ 产出目录是 stock_dump_5min（**非 spec 名**，见 main.py:_orphan_datasets）。
            受最近 90 天窗口 + 每日期每天 10 次配额约束，仅能作每日增量、不能回补历史。"}

  # 快照/一次性：没有时间维度，不参与交易日缺口判定
